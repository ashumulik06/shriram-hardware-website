<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Shriram Hardware Kale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Animations & UI Refinements */
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card {
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .hero-zoom {
            animation: slowZoom 20s infinite alternate;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
    <script>
tailwind.config = {
    theme: {
        extend: {
            colors: {
                brand: {
                    orange: '#F57C00',
                    yellow: '#FFB300',
                    dark: '#1A1A1B',
                    grey: '#333333'
                }
            }
        }
    }
}
</script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>
<body class="pt-20 overflow-x-hidden bg-slate-50 text-slate-900" x-data="{ mobileMenu: false }">

<!-- NAVBAR -->
<nav 
  class="fixed top-0 w-full z-50 bg-brand-dark/95 backdrop-blur-md border-b border-white/10 text-white"
  @click.outside="mobileMenu = false"
>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">

            <!-- LOGO -->
            <div class="flex items-center space-x-2">
                <div class="p-2 bg-brand-orange rounded-lg">
                    <i data-lucide="wrench" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold uppercase">
                    SHRIRAM <span class="text-brand-orange">HARDWARE</span>
                </span>
            </div>

            <!-- DESKTOP MENU -->
            <div class="hidden md:flex space-x-8 font-medium">
                <a href="index.html" class="hover:text-brand-orange">Home</a>
                <a href="about.html" class="hover:text-brand-orange">About</a>
                <a href="product.html" class="hover:text-brand-orange">Products</a>
                <a href="contact.html" class="px-5 py-2 bg-brand-orange rounded-full">Contact Us</a>
            </div>

            <!-- MOBILE BUTTON -->
            <div class="md:hidden">
                <button @click="mobileMenu = !mobileMenu" class="p-2">
                    <i data-lucide="menu" x-show="!mobileMenu"></i>
                    <i data-lucide="x" x-show="mobileMenu"></i>
                </button>
            </div>

        </div>
    </div>

    <!-- MOBILE MENU -->
    <div 
        x-show="mobileMenu" 
        x-cloak
        x-transition
        class="md:hidden bg-brand-dark border-t border-white/10 px-4 py-6 space-y-4 text-center"
    >

        <a href="index.html" @click="mobileMenu = false" class="block text-lg hover:text-brand-orange">Home</a>

        <a href="about.html" @click="mobileMenu = false" class="block text-lg hover:text-brand-orange">About</a>

        <a href="product.html" @click="mobileMenu = false" class="block text-lg hover:text-brand-orange">Products</a>

        <a href="contact.html" @click="mobileMenu = false" class="block text-lg text-brand-orange font-bold">Contact Us</a>

    </div>

</nav>

    <header class="relative h-80 flex items-center justify-center overflow-hidden bg-slate-900">
        <img src="https://images.unsplash.com/photo-1530124566582-ab6127761644?q=80&w=2000" 
             class="absolute inset-0 w-full h-full object-cover opacity-40 hero-zoom" alt="Hardware Store">
        <div class="relative z-10 text-center px-4">
            <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-3 tracking-tight">Our Products</h1>
            <p class="text-orange-400 text-lg md:text-2xl font-medium max-w-2xl mx-auto">
                Explore Our Wide Range of Hardware & Materials
            </p>
        </div>
    </header>

    <section class="sticky top-0 z-50 glass-nav shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="relative max-w-lg mx-auto mb-6">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                <input type="text" id="searchInput" placeholder="Search for tools, pipes, or hardware..." 
                       class="w-full pl-12 pr-4 py-3 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all shadow-sm">
            </div>

            <div id="categoryTabs" class="flex gap-3 overflow-x-auto no-scrollbar pb-2 justify-start md:justify-center">
                </div>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="bg-slate-100 p-6 rounded-full mb-4">
                <i data-lucide="package-search" class="w-12 h-12 text-slate-400"></i>
            </div>
            <h3 class="text-xl font-semibold text-slate-700">No products match your search</h3>
            <p class="text-slate-500">Try adjusting your filters or keywords.</p>
        </div>
    </main>

    <div id="modalOverlay" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Send Inquiry</h2>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <i data-lucide="x" class="w-6 h-6 text-slate-500"></i>
                </button>
            </div>
            <form id="inquiryForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1 uppercase tracking-tighter">Product Name</label>
                    <input type="text" id="modalProductName" readonly class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl font-semibold text-orange-600 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1 uppercase tracking-tighter">Full Name</label>
                    <input type="text" placeholder="John Doe" required class="w-full border border-slate-200 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1 uppercase tracking-tighter">Mobile Number</label>
                    <input type="tel" placeholder="+91 00000 00000" required class="w-full border border-slate-200 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-orange-600 text-white font-bold py-4 rounded-xl transition-all shadow-lg active:scale-95">
                    Submit Inquiry
                </button>
            </form>
        </div>
    </section>

    <script>
        // 1. DATA (Simulating a database response)
        const products = [
            { id: 1, name: "UPVC Elbow", category: "UPVC", price: 40, desc: "90-degree heavy-duty fitting.", img: "./image/elbow.png" },
            { id: 2, name: "UPVC Union", category: "UPVC", price: 60, desc: "High-pressure quick disassembly joint.", img: "https://images.unsplash.com/photo-1542013936693-884638332954?q=80&w=500" },
            { id: 3, name: "UPVC Tee", category: "UPVC", price: 40, desc: "90-degree heavy-duty fitting.", img: "./image/tee.png" },
            { id: 4, name: "UPVC socket", category: "UPVC", price: 60, desc: "High-pressure quick disassembly joint.", img: "./image/socket.png" },
            { id: 5, name: "UPVC Ball valve", category: "UPVC", price: 40, desc: "90-degree heavy-duty fitting.", img: "./image/ball valve.png" },
            { id: 6, name: "UPVC MTA/FTA", category: "UPVC", price: 60, desc: "High-pressure quick disassembly joint.", img: "./image/mta fta.png" },
            { id: 7, name: "Brass Elbow", category: "CPVC", price: 200, desc: "Reinforced brass thread for hot water.", img: "./image/brass elbow.png" },
            { id: 8, name: "CPVC Pipe", category: "CPVC", price: 120, desc: "Premium heat-resistant plumbing pipe.", img: "./image/pipe.png" },
            { id: 9, name: "CPVC FTA", category: "CPVC", price: 200, desc: "Reinforced brass thread for hot water.", img: "./image/fta.png" },
            { id: 10, name: "CPVC MTA", category: "CPVC", price: 120, desc: "Premium heat-resistant plumbing pipe.", img: "./image/mta.png" },
            { id: 11, name: "SWR Coupler", category: "SWR", price: 90, desc: "Rubber ring leak-proof SWR joint.", img: "./image/coupler.png" },
            { id: 12, name: "SWR bend", category: "SWR", price: 90, desc: "Rubber ring leak-proof SWR joint.", img: "./image/bend.png" },
            { id: 13, name: "SWR Single T", category: "SWR", price: 90, desc: "Rubber ring leak-proof SWR joint.", img: "./image/single t.png" },
            { id: 14, name: "SWR Single Y", category: "SWR", price: 90, desc: "Rubber ring leak-proof SWR joint.", img: "./image/single y.png" },
            { id: 15, name: "SWR Paras Pipe", category: "SWR", price: 90, desc: "Rubber ring leak-proof SWR joint.", img: "./image/paras pipe.png" },
            { id: 16, name: "GI Socket", category: "GI Fittings", price: 120, desc: "Galvanized iron rust-proof union.", img: "./image/gi socket.png" },
            { id: 17, name: "GI Elbow", category: "GI Fittings", price: 120, desc: "Galvanized iron rust-proof union.", img: "./image/gi elbow.png" },
            { id: 18, name: "GI Barel Nippal", category: "GI Fittings", price: 120, desc: "Galvanized iron rust-proof union.", img: "./image/gi barel nippal.png" },
            { id: 19, name: "GI Endcap", category: "GI Fittings", price: 120, desc: "Galvanized iron rust-proof union.", img: "./image/gi endcap.png" },
            { id: 20, name: "Sprinkler Set", category: "Agriculture & Irrigation", price: 500, desc: "Commercial grade farm sprinkler system.", img: "./image/sprinkler set.png" },
            { id: 21, name: "HDPE pipe", category: "Agriculture & Irrigation", price: 500, desc: "Commercial grade farm sprinkler system.", img: "./image/hdpe pipe.png" },
            { id: 22, name: "Drip irrigation", category: "Agriculture & Irrigation", price: 500, desc: "Commercial grade farm sprinkler system.", img: "./image/drip irrigation.png" },
            { id: 23, name: "Foot Valve", category: "Agriculture & Irrigation", price: 500, desc: "Commercial grade farm sprinkler system.", img: "./image/foot valve.png" },
            { id: 24, name: "Vent Cowl", category: "Agriculture & Irrigation", price: 500, desc: "Commercial grade farm sprinkler system.", img: "./image/vent cowl.png" },
            { id: 25, name: "Drill Machine", category: "Hardware & Tools", price: 1500, desc: "Industrial impact drill for masonry.", img: "./image/drill.png" },
            { id: 26, name: "Steel Hammer", category: "Hardware & Tools", price: 250, desc: "Forged steel head with rubber grip.", img: "./image/hammer.png" },
            { id: 27, name: "Screw", category: "Hardware & Tools", price: 250, desc: "Forged steel head with rubber grip.", img: "./image/screws.png" },
            { id: 28, name: "Measuring Tape", category: "Hardware & Tools", price: 250, desc: "Forged steel head with rubber grip.", img: "./image/measuring tape.png" },
            { id: 29, name: "Gloves", category: "Hardware & Tools", price: 250, desc: "Forged steel head with rubber grip.", img: "./image/gloves.png" }
        ]; 

        const categories = ["All", "UPVC", "CPVC", "SWR", "GI Fittings", "Agriculture & Irrigation", "Hardware & Tools"];
        let activeCategory = "All";

        // 2. RENDERING LOGIC
        function init() {
            renderTabs();
            renderProducts(products);
            lucide.createIcons();
        }

        function renderTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                        class="px-6 py-2.5 rounded-full text-sm font-bold transition-all border whitespace-nowrap
                        ${activeCategory === cat 
                            ? 'bg-orange-600 text-white border-orange-600 shadow-md scale-105' 
                            : 'bg-white text-slate-600 border-slate-200 hover:border-orange-300'}">
                    ${cat}
                </button>
            `).join('');
        }

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            const empty = document.getElementById('emptyState');
            
            if (data.length === 0) {
                grid.innerHTML = "";
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = data.map((p, index) => `
                <div class="product-card group bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl border border-slate-100 transition-all duration-500" 
                     style="animation-delay: ${index * 0.05}s">
                    <div class="h-56 overflow-hidden relative">
                        <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" alt="${p.name}">
                        <div class="absolute top-4 left-4">
                            <span class="bg-white/90 backdrop-blur px-3 py-1 rounded-lg text-[10px] font-black text-orange-600 uppercase tracking-widest shadow-sm">
                                ${p.category}
                            </span>
                        </div>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold text-slate-800 mb-1 group-hover:text-orange-600 transition-colors">${p.name}</h3>
                        <p class="text-slate-500 text-sm mb-6 line-clamp-2">${p.desc}</p>
                        <div class="flex items-center justify-between">
                            <div class="flex flex-col">
                                <span class="text-xs text-slate-400 font-bold uppercase">Best Price</span>
                                <span class="text-2xl font-black text-slate-900">₹${p.price}</span>
                            </div>
                            <button onclick="openModal('${p.name}')" 
                                    class="bg-slate-900 text-white p-3 rounded-2xl hover:bg-orange-600 transition-all shadow-lg active:scale-90">
                                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // 3. INTERACTION LOGIC
        function setCategory(cat) {
            activeCategory = cat;
            filterAndSearch();
            renderTabs();
        }

        function filterAndSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCat = activeCategory === "All" || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterAndSearch);

        // Modal Functions
        function openModal(name) {
            document.getElementById('modalProductName').value = name;
            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('modalOverlay').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('modalOverlay').classList.remove('flex');
            document.body.style.overflow = 'auto';
        }

        // Run Init
        window.onload = init;
    </script>
</body>
</html>
